<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name</title>
  <style>
    body { background-color: #0a0a0a; color: #e5e5e5; font-family: system-ui, sans-serif; display: flex; justify-content: center; padding: 40px 16px; margin: 0; }
    .card { background-color: #141414; border: 1px solid #262626; border-radius: 20px; max-width: 640px; width: 100%; padding: 36px; box-sizing: border-box; }
    .profile-header { display: flex; gap: 20px; align-items: center; margin-bottom: 24px; }
    .avatar { width: 84px; height: 84px; border-radius: 16px; object-fit: cover; }
    h1 { margin: 0; font-size: 1.8rem; color: #fff; }
    .subtitle { color: #a3a3a3; margin-top: 6px; font-size: 0.95rem; }
    .socials { margin-top: 10px; display: flex; gap: 12px; }
    .socials a { color: #a3a3a3; text-decoration: none; font-size: 0.9rem; }
    .socials a:hover { color: #fff; }
    h2 { font-size: 1.25rem; margin-top: 28px; margin-bottom: 12px; color: #fff; }
    ul { padding-left: 20px; margin: 0; line-height: 1.6; color: #d4d4d4; }
    li { margin-bottom: 8px; }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="profile-header">
      <img src="https://via.placeholder.com/84" alt="Profile" class="avatar" />
      <div>
        <h1>Your Name</h1>
        <div class="subtitle">Founder @ Company • Creator • Investor</div>
        <div class="socials">
          <a href="YOUR_LINKEDIN_URL">LinkedIn</a>
          <a href="YOUR_YOUTUBE_URL">YouTube</a>
          <a href="YOUR_X_URL">X</a>
        </div>
      </div>
    </div>

    <h2>Work</h2>
    <ul>
      <li><strong>Founder at Your Brand</strong>
        <ul>
          <li>Write a bullet point about what your agency or project does.</li>
          <li>Add key clients or achievements here.</li>
        </ul>
      </li>
    </ul>

    <h2>Content</h2>
    <ul>
      <li>I share thoughts on business and personal growth.</li>
    </ul>
  </div>
</body>
</html>
