<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Crypto Market Tracker</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #131b26;
      --border-color: #212e3f;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-color: #3fb950;
      --danger-color: #f85149;
      --primary-glow: rgba(56, 139, 253, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #58a6ff, #a5d6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Search & Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #58a6ff;
    }

    .refresh-btn {
      background-color: #212e3f;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .refresh-btn:hover {
      background-color: #303e54;
    }

    /* Crypto Table Card */
    .crypto-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 16px;
      font-size: 0.9rem;
    }

    th {
      background-color: rgba(0, 0, 0, 0.2);
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    tr:not(:last-child) td {
      border-bottom: 1px solid var(--border-color);
    }

    .coin-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .coin-info img {
      width: 28px;
      height: 28px;
    }

    .coin-name {
      font-weight: 600;
      color: var(--text-main);
    }

    .coin-symbol {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .price {
      font-weight: 600;
    }

    .positive {
      color: var(--accent-color);
      font-weight: 500;
    }

    .negative {
      color: var(--danger-color);
      font-weight: 500;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      th, td {
        padding: 12px 10px;
        font-size: 0.82rem;
      }
      .coin-info img {
        width: 22px;
        height: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>⚡ Live Crypto Market Tracker</h1>
      <p>Real-time cryptocurrency prices, market cap, and 24h performance.</p>
    </div>

    <!-- Controls -->
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search coin (e.g. Bitcoin, Ethereum)..." onkeyup="filterCoins()" />
      <button class="refresh-btn" onclick="fetchCryptoData()">Refresh 🔄</button>
    </div>

    <!-- Crypto Table -->
    <div class="crypto-card">
      <table>
        <thead>
          <tr>
            <th>Asset</th>
            <th>Price (USD)</th>
            <th>24h Change</th>
            <th>Market Cap</th>
          </tr>
        </thead>
        <tbody id="cryptoTableBody">
          <tr>
            <td colspan="4" class="loading">Loading market data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let cryptoData = [];

    async function fetchCryptoData() {
      const tableBody = document.getElementById('cryptoTableBody');
      tableBody.innerHTML = `<tr><td colspan="4" class="loading">Fetching live market data...</td></tr>`;

      try {
        // CoinGecko Free API ব্যবহার করে টপ ক্রিপ্টো ডেটা ফেচ করা
        const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=15&page=1&sparkline=false');
        
        if (!response.ok) {
          throw new Error('Failed to fetch data');
        }

        cryptoData = await response.json();
        displayCoins(cryptoData);

      } catch (error) {
        tableBody.innerHTML = `<tr><td colspan="4" class="loading" style="color: var(--danger-color);">Failed to load data. Please try again later.</td></tr>`;
      }
    }

    function displayCoins(coins) {
      const tableBody = document.getElementById('cryptoTableBody');
      tableBody.innerHTML = '';

      if (coins.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" class="loading">No matching coins found.</td></tr>`;
        return;
      }

      coins.forEach(coin => {
        const isPositive = coin.price_change_percentage_24h >= 0;
        const changeClass = isPositive ? 'positive' : 'negative';
        const changeSign = isPositive ? '+' : '';

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>
            <div class="coin-info">
              <img src="${coin.image}" alt="${coin.name}">
              <div>
                <div class="coin-name">${coin.name}</div>
                <div class="coin-symbol">${coin.symbol}</div>
              </div>
            </div>
          </td>
          <td class="price">$${coin.current_price.toLocaleString()}</td>
          <td class="${changeClass}">${changeSign}${coin.price_change_percentage_24h ? coin.price_change_percentage_24h.toFixed(2) : '0.00'}%</td>
          <td>$${coin.market_cap.toLocaleString()}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    function filterCoins() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = cryptoData.filter(coin => 
        coin.name.toLowerCase().includes(query) || coin.symbol.toLowerCase().includes(query)
      );
      displayCoins(filtered);
    }

    // পেজ লোড হওয়ার সাথে সাথেই ডেটা ফেচ হবে
    fetchCryptoData();
  </script>

</body>
</html>
